# ─── サイト基本情報 ───────────────────────────────────────────
url: "https://surf90.github.io"
baseurl: "/chiga-log"
title: "ちがログ"
description: "茅ヶ崎の海情報をログするデータサイト。天気、波、水温、タイドグラフ、気温をリアルタイムで網羅。"
lang: "ja"
author: "ISHIKAWA, Natsuki"
timezone: "Asia/Tokyo"
future: false

# ─── プラグイン ───────────────────────────────────────────────
plugins:
  - jekyll-sitemap

# ─── Jekyllビルドから除外するファイル ────────────────────────
exclude:
  - scripts/
  - DESIGN.md
  - progress.md
  - CLAUDE.md
  - README.md
  - FORK.md
  - reports/
  # クライアント未参照の元データ（Actions専用）。公開不要・容量削減のため除外。
  # 年次で差し替わるためワイルドカード指定（年を直書きすると翌年ぶんが
  # 除外から漏れ、約2MBの元データが公開ビルドに混入する）。
  - data/mooninfo_*.json
  - data/tide_data.json
  # フロントエンド品質チェック設定（公開ビルド不要・開発専用）
  - eslint.config.js
  # 以下はサイト本体ではないが exclude 漏れで実際に公開されていた（計約280KB）。
  # tests: Pythonユニットテスト / warning-worker: Cloudflare Worker のソース
  # （Workers へ別途デプロイするもの）/ npm マニフェスト: 開発ツール専用。
  - tests/
  - warning-worker/
  - package.json
  - package-lock.json
  # ローカルビルド用（独自 exclude は既定値を上書きするため明示）
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  # Jekyll 既定の exclude に含まれるが、上の独自 exclude が既定を丸ごと
  # 上書きするため再宣言が必要。これが無いとローカルに node_modules が
  # ある状態で `bundle exec jekyll build` が失敗する（CI は npm ci より
  # 前に build するため再現しない）。
  - node_modules
