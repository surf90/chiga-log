# ─── サイト基本情報 ───────────────────────────────────────────
url: "https://surf90.github.io"
baseurl: "/chiga-log"
title: "ちがログ"
description: "茅ヶ崎の海情報をログするデータサイト。天気、波、水温、タイドグラフ、気温をリアルタイムで網羅。"
lang: "ja"
author: "ISHIKAWA, Natsuki"
timezone: "Asia/Tokyo"
future: false

# ─── プラグイン ───────────────────────────────────────────────
plugins:
  - jekyll-sitemap

# ─── Jekyllビルドから除外するファイル ────────────────────────
exclude:
  - scripts/
  - DESIGN.md
  - progress.md
  - CLAUDE.md
  - README.md
  - FORK.md
  - reports/
  # クライアント未参照の元データ（Actions専用）。公開不要・容量削減のため除外。
  - data/mooninfo_2026.json
  - data/tide_data.json
