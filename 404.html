lang: ja
permalink: /404.html
sitemap: false
---

<!doctype html>
<html lang="{{ page.lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません | {{ site.data.site.name }}</title>
    <link
      rel="icon"
      href="{{ site.baseurl }}/assets/icons/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.min.css" />
    <!-- Web フォントは読み込まない。エラーページに追加リクエストを増やさず、
         ロゴは system sans の weight 900 へフォールバックさせる（三原則2）。 -->
    <style>
      .nf-wrap {
        text-align: center;
        padding: 18px 0 28px;
      }
      .nf-code {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 3.4rem;
        font-weight: 700;
        color: var(--brand);
        opacity: 0.35;
        line-height: 1;
        margin: 0 0 4px;
      }
      .nf-title {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .nf-text {
        font-size: 14px;
        color: var(--text-sub);
        margin: 0 0 18px;
      }
      .nf-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 20px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius-xs);
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
      }
      .nf-home:focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
      }
      @media (hover: hover) {
        .nf-home:hover {
          background: var(--brand);
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <span class="logo-text">{{ site.data.site.name }}</span>
          <span class="title-divider" aria-hidden="true">|</span>
          <span class="title-sub">{{ site.data.site.area_label }}</span>
        </h1>
        <span class="subtitle">{{ site.data.site.tagline }}</span>
      </header>

      <main class="nf-wrap">
        <p class="nf-code">404</p>
        <p class="nf-title">ページが見つかりません</p>
        <p class="nf-text">
          お探しのページは移動または削除された可能性があります。
        </p>
        <a class="nf-home" href="{{ site.baseurl }}/"
          >{{ site.data.site.name }} トップへ戻る</a
        >
      </main>
    </div>
  </body>
</html>
