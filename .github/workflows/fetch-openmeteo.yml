name: Fetch Open-Meteo Data

on:
  schedule:
    # 30分ごと (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # ワークフローごとに独立させる。共通グループにすると、待機中の run が
  # 別ワークフローの新規 run 投入で cancel され（GitHub は running 1 + pending 1
  # しか保持しない）、30分cronのOpen-Meteoが日次ジョブを潰す事故が起きる。
  # 跨ワークフローの push 競合は各ジョブの pull --rebase リトライで吸収する。
  group: data-push-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch-openmeteo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run fetch script
        run: python scripts/fetch_openmeteo.py
      - name: Fetch JMA warnings (BFF)
        run: python scripts/fetch_warning.py
      - name: Fetch heatstroke alerts
        run: python scripts/fetch_heatstroke_alert.py
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/weather_marine.json data/wind_forecast.json data/warning_chigasaki.json data/heatstroke_alert.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update Open-Meteo data"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((RANDOM % 10 + 5))
            done
          fi
