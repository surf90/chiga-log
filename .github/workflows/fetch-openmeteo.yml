name: Fetch Open-Meteo Data

on:
  schedule:
    # 30分ごと (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch-openmeteo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run fetch script
        run: python scripts/fetch_openmeteo.py
      - name: Fetch JMA warnings (BFF)
        run: python scripts/fetch_warning.py
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/weather_marine.json data/wind_forecast.json data/warning_chigasaki.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update Open-Meteo data"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((RANDOM % 10 + 5))
            done
          fi
