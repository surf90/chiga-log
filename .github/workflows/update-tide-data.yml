name: Update Tide Data

on:
  schedule:
    # 毎日 UTC 15:15 （＝日本時間の午前0時15分） に実行
    # update-daily-data.yml (15:05) と 10 分ずらし、concurrency 待機を短縮する
    - cron: '15 15 * * *'
  workflow_dispatch: # GitHubの画面から手動で実行するボタンも有効化

concurrency:
  group: data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリにファイルを書き込む権限

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fetch Tide Data
      env:
        # GitHub Secrets に登録したAPIキーを利用する
        STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
      run: python scripts/fetch_tide.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/tide_data.json
        # データに更新（差分）がある場合のみコミットしてプッシュする
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Auto-update tide data"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((RANDOM % 10 + 5))
          done
        fi