name: Fetch JMA Wave Guidance

on:
  schedule:
    # JST 9:05, 15:05, 21:05 -> UTC 0:05, 6:05, 12:05
    - cron: '5 0,6,12 * * *'
  workflow_dispatch:

concurrency:
  # ワークフローごとに独立させる。共通グループにすると、待機中の run が
  # 別ワークフローの新規 run 投入で cancel され（GitHub は running 1 + pending 1
  # しか保持しない）、30分cronのOpen-Meteoが日次ジョブを潰す事故が起きる。
  # 跨ワークフローの push 競合は各ジョブの pull --rebase リトライで吸収する。
  group: data-push-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-wave-guid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run fetch script
        run: python scripts/fetch_wave_guidance.py
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/wave_guid_*.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update wave guidance data"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((RANDOM % 10 + 5))
            done
          fi
