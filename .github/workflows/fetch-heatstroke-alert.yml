name: Fetch Heatstroke Alert

on:
  schedule:
    # 公式発表 05:00 / 14:00 / 17:00 JST の25分・15分・5分前。
    # Actionsの起動遅延を見込み、各発表につき3回取得を試みる。
    #
    # 熱中症は fetch-openmeteo.yml (*/30) でも取得しており一見重複だが、
    # GitHub のスケジュール遅延で */30 の実効間隔は約50分・最大93分まで
    # 伸びる（実測）。発表直後の取りこぼしを防ぐため、この専用cron
    # (9 run/日) は残す。削減する場合は上記の遅延実績を再確認すること。
    - cron: "35,45,55 19,4,7 * * *"
  workflow_dispatch:

concurrency:
  # ワークフローごとに独立させる。共通グループにすると、待機中の run が
  # 別ワークフローの新規 run 投入で cancel され（GitHub は running 1 + pending 1
  # しか保持しない）、30分cronのOpen-Meteoが日次ジョブを潰す事故が起きる。
  # 跨ワークフローの push 競合は各ジョブの pull --rebase リトライで吸収する。
  group: data-push-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch-heatstroke-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch heatstroke alert
        run: python scripts/fetch_heatstroke_alert.py
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/heatstroke_alert.json
          if ! git diff --cached --quiet; then
            git commit -m "Update heatstroke alert"
            # リトライを全て使い切っても for ループ自体は正常終了するため、
            # 素の `for ... done` だと push 失敗がジョブ success のまま隠れる。
            # コミットはローカルにしか残らず次回 checkout で消えるので、
            # データ更新が静かに停止する。成否を明示的に持ち回って落とす。
            pushed=false
            for i in 1 2 3; do
              # 追従先は実行中のブランチ。main 決め打ちだと workflow_dispatch を
              # ブランチで実行した際、浅いクローンに main の共通祖先が無く
              # add/add コンフリクトになり push できない（main 上では同じ挙動）。
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
                pushed=true
                break
              fi
              sleep $((RANDOM % 10 + 5))
            done
            if [ "$pushed" != true ]; then
              echo "::error::push に3回失敗しました。変更は反映されていません。"
              exit 1
            fi
          fi
