name: Fetch Heatstroke Alert

on:
  schedule:
    # 公式発表 05:00 / 14:00 / 17:00 JST の25分・15分・5分前。
    # Actionsの起動遅延を見込み、各発表につき3回取得を試みる。
    - cron: "35,45,55 19,4,7 * * *"
  workflow_dispatch:

concurrency:
  group: data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch-heatstroke-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Fetch heatstroke alert
        run: python scripts/fetch_heatstroke_alert.py
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/heatstroke_alert.json
          if ! git diff --cached --quiet; then
            git commit -m "Update heatstroke alert"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((RANDOM % 10 + 5))
            done
          fi
