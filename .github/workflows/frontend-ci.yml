name: Frontend CI

# フロントエンドのソース変更時のみ実行（cron 追加なし＝三原則3順守）。
on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "sw.js"
      - "warning-worker/src/**"
      - "warning-worker/test/**"
      - "**/*.html"
      - "_data/**"
      - "eslint.config.js"
      - ".pa11yci"
      - "package.json"
      - "package-lock.json"
      - "tests/test_tide_frontend.cjs"
      - "tests/test_live_frontend.cjs"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "sw.js"
      - "warning-worker/src/**"
      - "warning-worker/test/**"
      - "**/*.html"
      - "_data/**"
      - "eslint.config.js"
      - ".pa11yci"
      - "package.json"
      - "package-lock.json"
      - "tests/test_tide_frontend.cjs"
      - "tests/test_live_frontend.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 読み取り専用ジョブでは checkout が .git/config に残す認証情報が不要。
        # 後続ステップ（依存の取得やテスト実行）から参照されないようにする。
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned frontend tools
        run: npm ci
      - name: ESLint (source JS)
        run: npx --no-install eslint assets/js/app.js assets/js/en.js sw.js assets/js/sw-register.js
      - name: Tide frontend unit tests
        run: npm test
      - name: Warning BFF (Cloudflare Worker) unit tests
        # Worker は Pages とは別デプロイだがソースは本リポジトリにあり、
        # 壊れると警報表示が黙って落ちる。標準の node --test のみで追加依存なし。
        run: node --test "warning-worker/test/*.test.js"
      - name: Verify Chart.js SRI hash
        # index.html の integrity と自ホストの実ファイルがずれると、
        # ブラウザがスクリプトを丸ごと拒否しグラフが全て描画されなくなる。
        # 差分が出た時点で CI を落として気付けるようにする。
        run: |
          expected=$(grep -o 'sha384-[A-Za-z0-9+/=]*' index.html | head -n1)
          actual="sha384-$(openssl dgst -sha384 -binary assets/vendor/chart.umd.min.js | openssl base64 -A)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::SRI 不一致: index.html=$expected 実ファイル=$actual"
            exit 1
          fi
          echo "SRI OK: $actual"
      - name: Prettier check
        run: npx --no-install prettier --check "**/*.{html,css,js,cjs,json}"

  a11y:
    name: pa11y (WCAG2AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 読み取り専用ジョブでは checkout が .git/config に残す認証情報が不要。
        # 後続ステップ（依存の取得やテスト実行）から参照されないようにする。
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site (Liquid 解決)
        run: bundle exec jekyll build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned accessibility tools
        # pa11y-ci -> puppeteer の Chromium 自動DL(zip展開)を止め、Runner 同梱の
        # google-chrome-stable を使わせる。extract-zip の symlink 未検証脆弱性
        # （GHSA-x7jf-2287-qcpf, 修正版なし）の展開経路自体を通らせない対策。
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Serve built site
        # baseurl(/chiga-log) 配下で配信する。http-server はルート配信のため、
        # _site を _serve/chiga-log に写して /chiga-log/ を解決可能にする（本番パス再現）。
        run: |
          mkdir -p _serve/chiga-log
          cp -r _site/. _serve/chiga-log/
          npx --no-install http-server _serve -p 4000 --silent &
      - name: Wait for server
        # 到達不能時に無期限ハングしないよう 60 秒でタイムアウトさせる。
        run: npx --no-install wait-on -t 60000 http://localhost:4000/chiga-log/
      - name: pa11y-ci
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: npx --no-install pa11y-ci

  # Dependabot のパッチ更新（x.y.Z）だけ、このワークフローのジョブが全部通ったら自動でマージする。
  # ほかのワークフローのチェックが未完了・失敗なら見送り、残りは人が判断する（2026-10-23 導入）。
  dependabot-automerge:
    needs: [lint, a11y]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: パッチ更新ならマージする
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # ほかのチェック（別ワークフロー・CodeQL など）の完了を最大10分待つ
          others='[.[] | select(.name != "dependabot-automerge")]'
          for _ in $(seq 1 30); do
            pending=$(gh pr checks "$PR_URL" --json name,bucket --jq "$others | map(select(.bucket == \"pending\")) | length" || true)
            [ "$pending" = "0" ] && break
            sleep 20
          done
          failed=$(gh pr checks "$PR_URL" --json name,bucket --jq "$others | map(select(.bucket != \"pass\" and .bucket != \"skipping\")) | length" || true)
          if [ "$failed" != "0" ]; then
            echo "ほかのチェックが未完了か失敗しているため、自動マージを見送ります"
            exit 0
          fi
          if [ "$(gh pr view "$PR_URL" --json state --jq .state)" != "OPEN" ]; then
            echo "マージ済みのため何もしません"
            exit 0
          fi
          gh pr merge "$PR_URL" --squash
          # GITHUB_TOKEN でのマージは push のワークフローを起動しないため、手動実行口から起動する
          gh workflow run minify.yml --ref main
