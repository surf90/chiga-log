name: Frontend CI

# フロントエンドのソース変更時のみ実行（cron 追加なし＝三原則3順守）。
on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "**/*.html"
      - "eslint.config.js"
      - ".pa11yci"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "**/*.html"
      - "eslint.config.js"
      - ".pa11yci"

permissions:
  contents: read

jobs:
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ESLint (source JS)
        run: npx --yes eslint assets/js/app.js
      - name: Prettier check
        run: npx --yes prettier --check "**/*.{html,css,js,json}"

  a11y:
    name: pa11y (WCAG2AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build site (Liquid 解決)
        run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Serve built site
        # baseurl(/chiga-log) 配下で配信する。http-server はルート配信のため、
        # _site を _serve/chiga-log に写して /chiga-log/ を解決可能にする（本番パス再現）。
        run: |
          mkdir -p _serve/chiga-log
          cp -r _site/. _serve/chiga-log/
          npx --yes http-server _serve -p 4000 --silent &
      - name: Wait for server
        # 到達不能時に無期限ハングしないよう 60 秒でタイムアウトさせる。
        run: npx --yes wait-on -t 60000 http://localhost:4000/chiga-log/
      - name: pa11y-ci
        run: npx --yes pa11y-ci
