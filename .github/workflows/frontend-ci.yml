name: Frontend CI

# フロントエンドのソース変更時のみ実行（cron 追加なし＝三原則3順守）。
on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "**/*.html"
      - "eslint.config.js"
      - ".pa11yci"
      - "package.json"
      - "package-lock.json"
      - "tests/test_tide_frontend.cjs"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "**/*.html"
      - "eslint.config.js"
      - ".pa11yci"
      - "package.json"
      - "package-lock.json"
      - "tests/test_tide_frontend.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned frontend tools
        run: npm ci
      - name: ESLint (source JS)
        run: npx --no-install eslint assets/js/app.js
      - name: Tide frontend unit tests
        run: npm test
      - name: Prettier check
        run: npx --no-install prettier --check "**/*.{html,css,js,cjs,json}"

  a11y:
    name: pa11y (WCAG2AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build site (Liquid 解決)
        run: bundle exec jekyll build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned accessibility tools
        run: npm ci
      - name: Serve built site
        # baseurl(/chiga-log) 配下で配信する。http-server はルート配信のため、
        # _site を _serve/chiga-log に写して /chiga-log/ を解決可能にする（本番パス再現）。
        run: |
          mkdir -p _serve/chiga-log
          cp -r _site/. _serve/chiga-log/
          npx --no-install http-server _serve -p 4000 --silent &
      - name: Wait for server
        # 到達不能時に無期限ハングしないよう 60 秒でタイムアウトさせる。
        run: npx --no-install wait-on -t 60000 http://localhost:4000/chiga-log/
      - name: pa11y-ci
        run: npx --no-install pa11y-ci
