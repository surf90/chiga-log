name: Update JMA Tide Data

on:
  schedule:
    # 12月20日 UTC 15:05（= JST 12月21日 0:05）。年明け前に翌年ぶんを取り込む。
    # これが無いと tide_data.json は当年ぶんしか持たず、JST 1/1 に当日キーが
    # 引けずタイドグラフが空になる（1/1 の実行では JST では既に手遅れ）。
    - cron: '5 15 20 12 *'
    # 1月1日 UTC 15:05（= JST 1月2日 0:05）。12月に翌年ぶんが未公開だった
    # 場合の保険として残す。
    - cron: '5 15 1 1 *'
    # 7月1日。年央の改訂取り込み。
    - cron: '5 15 1 7 *'
  workflow_dispatch: # 手動実行ボタンも有効化

concurrency:
  # ワークフローごとに独立させる。共通グループにすると、待機中の run が
  # 別ワークフローの新規 run 投入で cancel され（GitHub は running 1 + pending 1
  # しか保持しない）、30分cronのOpen-Meteoが日次ジョブを潰す事故が起きる。
  # 跨ワークフローの push 競合は各ジョブの pull --rebase リトライで吸収する。
  group: data-push-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-jma-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Fetch JMA Tide Data
      run: python scripts/generate_tide.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/tide_data.json
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Auto-update JMA tide data"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((RANDOM % 10 + 5))
          done
        fi
