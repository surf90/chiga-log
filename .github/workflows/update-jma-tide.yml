name: Update JMA Tide Data

on:
  schedule:
    # 1月1日 UTC 15:05（= JST 1月2日 0:05）と 7月1日に実行
    - cron: '5 15 1 1 *'
    - cron: '5 15 1 7 *'
  workflow_dispatch: # 手動実行ボタンも有効化

concurrency:
  group: data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-jma-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.10'

    - name: Fetch JMA Tide Data
      run: python scripts/generate_tide.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/tide_data.json
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Auto-update JMA tide data"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((RANDOM % 10 + 5))
          done
        fi
