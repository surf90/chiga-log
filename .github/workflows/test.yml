name: Python unit tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '_data/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '_data/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 読み取り専用ジョブでは checkout が .git/config に残す認証情報が不要。
        # 後続ステップ（依存の取得やテスト実行）から参照されないようにする。
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run pytest
        run: pytest tests -v

  # Dependabot のパッチ更新（x.y.Z）だけ、このワークフローのジョブが全部通ったら自動でマージする。
  # ほかのワークフローのチェックが未完了・失敗なら見送り、残りは人が判断する（2026-10-23 導入）。
  dependabot-automerge:
    needs: [test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: パッチ更新ならマージする
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # ほかのチェック（別ワークフロー・CodeQL など）の完了を最大10分待つ
          others='[.[] | select(.name != "dependabot-automerge")]'
          for _ in $(seq 1 30); do
            pending=$(gh pr checks "$PR_URL" --json name,bucket --jq "$others | map(select(.bucket == \"pending\")) | length" || true)
            [ "$pending" = "0" ] && break
            sleep 20
          done
          failed=$(gh pr checks "$PR_URL" --json name,bucket --jq "$others | map(select(.bucket != \"pass\" and .bucket != \"skipping\")) | length" || true)
          if [ "$failed" != "0" ]; then
            echo "ほかのチェックが未完了か失敗しているため、自動マージを見送ります"
            exit 0
          fi
          if [ "$(gh pr view "$PR_URL" --json state --jq .state)" != "OPEN" ]; then
            echo "マージ済みのため何もしません"
            exit 0
          fi
          gh pr merge "$PR_URL" --squash
