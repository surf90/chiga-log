name: Minify CSS and JS

on:
  push:
    branches: [main]
    paths:
      - "assets/css/style.css"
      - "assets/js/app.js"
      - "package.json"
      - "package-lock.json"

concurrency:
  # ワークフローごとに独立させる。共通グループにすると、待機中の run が
  # 別ワークフローの新規 run 投入で cancel され（GitHub は running 1 + pending 1
  # しか保持しない）、30分cronのOpen-Meteoが日次ジョブを潰す事故が起きる。
  # 跨ワークフローの push 競合は各ジョブの pull --rebase リトライで吸収する。
  group: data-push-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install minify tools
        run: |
          python -m pip install csscompressor==0.9.5
          npm ci

      - name: Minify CSS
        run: |
          python -c "
          import csscompressor, pathlib
          src = pathlib.Path('assets/css/style.css').read_text(encoding='utf-8')
          out = csscompressor.compress(src)
          pathlib.Path('assets/css/style.min.css').write_text(out, encoding='utf-8')
          print(f'CSS: {len(src)} -> {len(out)} bytes')
          "

      - name: Minify JS
        run: npx --no-install terser assets/js/app.js --compress --mangle --output assets/js/app.min.js

      - name: Commit minified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.min.css assets/js/app.min.js
          if ! git diff --cached --quiet; then
            # [skip ci] を付けない。GITHUB_TOKEN のpushは通常のワークフローを
            # 起動しないため再帰の心配は無い一方、Pages のビルド/デプロイまで
            # スキップされ、minify 済みの .min.css / .min.js が次のデータpush
            # まで配信されない（最大1時間強の反映遅れ）ため。
            git commit -m "chore: minify CSS and JS"
            # リトライを全て使い切っても for ループ自体は正常終了するため、
            # 素の `for ... done` だと push 失敗がジョブ success のまま隠れる。
            # コミットはローカルにしか残らず次回 checkout で消えるので、
            # データ更新が静かに停止する。成否を明示的に持ち回って落とす。
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              sleep $((RANDOM % 10 + 5))
            done
            if [ "$pushed" != true ]; then
              echo "::error::push に3回失敗しました。変更は反映されていません。"
              exit 1
            fi
          fi
