name: Minify CSS and JS

on:
  push:
    branches: [main]
    paths:
      - "assets/css/style.css"
      - "assets/js/app.js"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install minify tools
        run: |
          python -m pip install csscompressor==0.9.5
          npm ci

      - name: Minify CSS
        run: |
          python -c "
          import csscompressor, pathlib
          src = pathlib.Path('assets/css/style.css').read_text(encoding='utf-8')
          out = csscompressor.compress(src)
          pathlib.Path('assets/css/style.min.css').write_text(out, encoding='utf-8')
          print(f'CSS: {len(src)} -> {len(out)} bytes')
          "

      - name: Minify JS
        run: npx --no-install terser assets/js/app.js --compress --mangle --output assets/js/app.min.js

      - name: Commit minified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.min.css assets/js/app.min.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: minify CSS and JS [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((RANDOM % 10 + 5))
            done
          fi
