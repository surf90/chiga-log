version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # 警報BFF（Cloudflare Worker）。ルートとは別の package-lock.json を持つため
  # directory: "/" のエントリでは更新されず、2026-08 の undici 系アラートは
  # 手動対応が必要だった。個別に登録して自動追従させる。
  - package-ecosystem: npm
    directory: "/warning-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
